<script src="https://canvasjs.com/assets/script/jquery-1.11.1.min.js"></script>
<script src="https://cdn.canvasjs.com/jquery.canvasjs.min.js"></script>
<div id="chartContainer">
</div>

<script>

        // Disable page refresh
        function disableRefresh() {
            document.onkeydown = function (e) {
                if (e.key === 'F5' || e.key === 'Enter') {
                    e.preventDefault();
                }
            };
        }

        // Prevent going back to the previous page
        function disableBackButton() {
            window.history.pushState(null, '', window.location.href);
            window.onpopstate = function (event) {
                window.history.pushState(null, '', window.location.href);
            };
        }


  
  window.onload = function() {
    initializeChart();
    disableRefresh();
    disableBackButton();
      // Move the overlay div to the bottom after the chart has been initialized
  const chartContainer = document.getElementById("chartContainer");
  const overlay = document.getElementById("overlay");
  chartContainer.appendChild(overlay);
  };

  function initializeChart() {
    var dataPoints = [];

    var chart = new CanvasJS.Chart("chartContainer", {
      backgroundColor: "black",
      animationEnabled: true,
      zoomEnabled: true,
      width: 550,
      height: 310,
      title: {
        text: null
      },
      axisX: {
        minimum: 0.1,
        maximum: 60.9,
        interval: 1,
        gridColor: "black",
        lineColor: "black",
        tickColor: "black",
      },
      axisY: {
        gridColor: "black",
        lineColor: "black",
        tickColor: "black",
        lineThickness: 0,
        tickLength: 0,
        labelFormatter: function() {
          return "";
        }
      },
      data: [{
        type: "line",
        lineThickness: 2,
        lineColor: "rgb(230, 120, 40)",
        markerSize: 8,
        markerColor: "rgb(180, 120, 70)",
        markerType: "circle",
        markerBorderColor: "rgb(180, 120, 70)",
        markerBorderThickness: 1,
        toolTipContent: "Value: {y}",
        dataPoints: dataPoints
      }]
    });

    var xStart = 1;
    var newDataCount = 60;
    var updateCount = 0;
    var updateInterval;
    var round = {{ data['round'] }};

    function addData(data) {
      for (var i = 0; i < data.length; i++) {
        var x = data[i][0] - updateCount;
        var y = data[i][1];
        dataPoints.push({ x: x, y: y });
      }

      if (dataPoints.length > newDataCount) {
        dataPoints.splice(0, dataPoints.length - newDataCount);
      }

      for (var i = 0; i < dataPoints.length - 1; i++) {
        dataPoints[i].markerSize = 0;
      }

      if (dataPoints.length > newDataCount) {
        dataPoints.shift();
      }

      chart.render();

      updateCount++;

      if (updateCount === 60) {
        clearInterval(updateInterval);
      }
    }

    function updateData() {
      var url = "https://raw.githubusercontent.com/mojolaban/simul-numbers/main/round" + round + ".json";
      $.getJSON(url, function(data) {
        var slicedData = data.slice(xStart - 1, xStart - 1 + newDataCount);
        addData(slicedData);
        xStart++;
        updatePricePoint(chart);
      });
    }

    function updatePricePoint(chart) {
      var dataPoints = chart.options.data[0].dataPoints;
      var latestDataPoint = dataPoints[dataPoints.length - 1].y;
      var previousDataPoint = dataPoints[dataPoints.length - 2].y;

      var pricePoint = document.getElementById("pricePoint");
      pricePoint.textContent = formatNumber(latestDataPoint);

      var percentage = ((latestDataPoint - previousDataPoint) / previousDataPoint) * 100;
      var percPoint = document.getElementById("percPoint");
      if (percentage < 0) {
        percPoint.textContent = "▼ " + formatNumber(percentage.toFixed(2)) + "%";
        percPoint.style.color = "rgb(200, 50, 20)";
      } else if (percentage > 0) {
        percPoint.textContent = "▲ " + formatNumber(percentage.toFixed(2)) + "%";
        percPoint.style.color = "rgb(40, 180, 120)";
      } else {
        percPoint.textContent = formatNumber(percentage.toFixed(2)) + "%";
        percPoint.style.color = "rgb(40, 180, 120)";
      }

      setTimeout(function() {
        blinkMarker(chart);
      }, 200); // Blink every 200 milliseconds

      setTimeout(function() {
        updatePricePoint(chart);
      }, 1000); // Update line every 1000 milliseconds
    }

    function blinkMarker(chart) {
      var marker = chart.data[0].markerType;
      chart.data[0].markerType = marker === "circle" ? "none" : "circle";
      chart.render();
    }

    updateData();
    updateInterval = setInterval(updateData, 1000);
  }

  function formatNumber(value) {
    if (value < 0) {
      return "(" + Math.abs(value).toLocaleString() + ")";
    } else {
      return value.toLocaleString();
    }
  }
</script>
