<script>
  $(document).ready(function() {
    var animationComplete = false; // Flag to track animation status

    function animateNumber() {
      var numberElement = document.getElementById('number');
      numberElement.classList.add('number-changing');
      numberElement.style.fontFamily = 'Arial'; // Set the font family to Arial

      var numbers = shuffleArray(Array.from({ length: 15 }, (_, index) => index + 1)); // Array of shuffled numbers from 1 to 15

      var currentIndex = 0;
      var duration = 4750; // Duration of shuffling number in milliseconds (adjust as needed)
      var intervalTime = Math.floor(duration / (numbers.length * 2)); // Interval time based on duration and number of elements

      var interval = setInterval(function() {
        if (currentIndex >= numbers.length * 2) {
          clearInterval(interval);
          numberElement.classList.remove('number-changing');
        } else {
          var numberIndex = currentIndex % numbers.length;
          numberElement.textContent = numbers[numberIndex];
          currentIndex++;
        }
      }, intervalTime);

      // Delay the animation end with a setTimeout
      setTimeout(function() {
        clearInterval(interval);

        // Check if the value is provided
        if (document.getElementById('comp_round')) {
          numberElement.textContent = document.getElementById('comp_round').textContent;
        }

        numberElement.classList.remove('number-changing');
        animationComplete = true; // Set the animation status to complete
      }, duration);
    }

    function shuffleArray(array) {
      var currentIndex = array.length,
        temporaryValue,
        randomIndex;

      while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;

        temporaryValue = array[currentIndex];
        array[currentIndex] = array[randomIndex];
        array[randomIndex] = temporaryValue;
      }

      return array;
    }

    animateNumber(); // Start the animation

    // Assuming comp_rgainfinal is a variable holding the compensation amount
    var comp_rgainfinal = {{ comp_rgainfinal }}; // This should be a numeric value

    // Format the compensation amount in Indonesian locale
    var formattedCompensation = new Intl.NumberFormat('id-ID', {
      style: 'currency',
      currency: 'IDR',
      minimumFractionDigits: 0 // Adjust as necessary
    }).format(comp_rgainfinal);

    // Delay showing the formatted compensation amount
    setTimeout(function() {
      var compensationAmtElement = document.getElementById('compensation-amt');
      compensationAmtElement.innerHTML = formattedCompensation; // Use innerHTML to insert formatted string
      compensationAmtElement.style.visibility = 'visible';
    }, 5000); // Delay of 5 seconds

    
  });
</script>
