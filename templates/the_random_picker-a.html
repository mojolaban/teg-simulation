<!DOCTYPE html>
<html>
<head>
  {% include 'bootstrap.html' %}
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TEG</title>

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100vh;
      width: 100vw;
      overflow: auto;
      background-color: rgb(0, 0, 0);
      color: white;
      font-family: Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
    }

    #container {
      max-width: 95%;
      margin: 10px auto;
      background-color: black;
      border: 1px solid black;
      border-radius: 1rem;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Header styles */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      height: 4rem;
      background-color: white;
      border-radius: 0.5rem;
      margin: 0;
      max-width: 100%;
    }

    .round-display {
      color: rgb(80, 80, 80);
      font-size: 2.5rem;
      margin-left: 2rem;
    }

    .timer-display {
      background: transparent;
      border: 1px solid red;
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
      color: rgb(80, 80, 80);
      font-size: 2rem;
      margin-right: 2rem;
      width: 20rem;
      height: 3rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Main content */
    .main-content {
      display: flex;
      gap: 1rem;
      height: calc(100vh - 5rem);
      padding: 1rem;
    }

    /* Left panel */
    #left-pane {
      width: 15rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-top: 24rem;
      margin-bottom: 2rem;
    }

    /* Position indicator */
    .position-indicator {
      height: 3rem;
      background: rgb(10, 10, 10);
      border: 1px solid rgb(40, 40, 40);
      border-radius: 0.5rem;
      padding: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .position-indicator img {
      width: 1rem;
      height: 1rem;
      margin-right: 0.5rem;
    }

    .position-indicator span {
      color: white;
      font-size: 0.9rem;
    }

    /* Middle panel */
    #middle-pane {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateX(-3rem);
    }

    .thanks-section {
      text-align: center;
      margin-top: 3rem;
    }

    .thanks-title {
      color: white;
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }

    .thanks-subtitle {
      color: white;
      font-size: 1.5rem;
      margin-bottom: 2rem;
    }

    /* Compensation button */
    .compensation-container {
      margin: 2rem auto;
      text-align: center;
    }

    #compensation {
      height: 3.5rem;
      width: 14rem;
      text-align: center;
      border-radius: 0.5rem;
      background: rgb(40, 180, 120);
      border: none;
      color: white;
      font-size: 1.2rem;
    }

    .action-button {
      width: 17rem;
      padding: 0.8rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 1.1rem;
      font-weight: bold;
      background-color: white;
      color: rgb(80, 80, 80);
      cursor: pointer;
      transition: background-color 0.2s;
    }

    /* Random round selector */
    .random-round-display {
      width: 12rem;
      background: rgb(10, 10, 10);
      border: 1px solid rgb(40, 40, 40);
      border-radius: 0.5rem;
      padding: 1rem;
      margin-top: 2rem;
      transform: translateX(-8rem);
      text-align: center;  /* Added to center content */
      display: flex;
      flex-direction: column;
      align-items: center;  /* Added for better centering */
    }

    .random-round-title {
      color: rgb(130, 130, 130);
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      width: 100%;  /* Added for full width */
      text-align: cent;  /* Keep title left-aligned */
    }

    #number {
      font-size: 2.5rem;
      color: white;  /* Changed from rgb(40, 40, 40) to white */
      font-family: Arial;

    }

    @keyframes numberChange {
      0% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0; }
    }

    .number-changing {
      animation: numberChange 0.5s linear infinite;
    }

    /* Warning message */
    .warning-message {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(255, 69, 0, 0.9);
      color: white;
      padding: 0.625rem 1.25rem;
      border-radius: 0.5rem;
      z-index: 10000;
      display: none;
      text-align: center;
      white-space: nowrap;
    }

    /* Responsive design */
    @media (max-width: 1200px), (max-height: 750px) {
      #container {
        transform: scale(0.88);
        transform-origin: center top;
        min-width: 1200px;
      }
    }

    @media screen and (orientation: portrait) {
      body {
        transform: rotate(-90deg);
        transform-origin: left top;
        width: 100vh;
        height: 100vw;
        position: absolute;
        top: 100%;
        left: 0;
      }
    }
  </style>
</head>

<body class="disable-selection">
  <div id="container">
    <!-- Header Section -->
    <div class="header">
      <div class="round-display">
        Akhir Ronde 15
      </div>
      <div class="timer-display">
        <span style="margin-right: 1rem; font-size: 2rem;">Waktu:</span>
        <span id="countdown" style="font-size: 2rem;margin-right: 1rem;margin-left:1rem;">0</span>
        <span style="font-size: 2rem;margin-left:1rem;">s</span>
      </div>
    </div>

    <div class="main-content">
      <!-- Left Panel -->
      <div id="left-pane">
        <!-- Position Indicator -->
        <div class="position-indicator">
          <div class="indicator-content">
            <img src="{{ url_for('static', filename='star.png') }}" alt="Star">
            <span><b>KOMPENSASI</b></span>
          </div>
        </div>
      </div>

      <!-- Middle Panel -->
      <div id="middle-pane">
        <div class="thanks-section">
          <div class="thanks-title">
            Terima kasih atas partisipasi Anda dalam studi ini.
          </div>
          <div class="thanks-subtitle">
            Sebagai bentuk penghargaan<br>
            Anda berhak menerima e-gift voucher senilai
          </div>

          <div class="compensation-container">
            <button type="text" id="compensation" name="compensation-amt">
              <span id="compensation-amt" style="visibility: hidden"></span>
            </button>
          </div>

          <form action="{{ url_for('index') }}" method="post" style="margin-top: 3rem;">
              <button type="submit" id="buttonToSurvey" class="action-button"
                      onmouseover="this.style.backgroundColor='rgb(10,10,10)'"
                      onmouseout="this.style.backgroundColor='white'">
                  Lanjutkan
              </button>
              <input type="hidden" name="form_type" value="survey">
              <input type="hidden" name="id" value="{{ user_id }}">
              <input type="hidden" name="gr" value="{{ gr }}">
              <input type="hidden" name="lang" value="{{ lang }}">
            <input type="hidden" name="comp_amt" value="{{ comp_rgainfinal }}">
            <input type="hidden" name="comp_round" value="{{ comp_round }}">
            <input type="hidden" name="comp_rgainfinal" value="{{ comp_amt }}">
          </form>
          <span id="comp_round" style="display: none;">{{ comp_round }}</span>
        </div>
      </div>

      <!-- Right Panel -->
      <div id="right-pane">
        <div class="random-round-display">
          <div class="random-round-title">
            Pemilih Ronde Acak
          </div>
          <div id="number">0</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Warning Message Container -->
  <div id="warningMessage" class="warning-message"></div>

  <script>
    // Prevent text selection
    document.addEventListener('selectstart', function(e) {
      e.preventDefault();
    });

    // Navigation Protection
    window.addEventListener('popstate', function() {
      window.history.pushState(null, null, window.location.href);
      showWarning('Jangan kembali ke halaman sebelumnya atau memuat ulang halaman!');
    });

    setInterval(() => {
      window.history.pushState(null, null, window.location.href);
    }, 100);

    // Warning Message Function
    function showWarning(message) {
      const warningDiv = document.getElementById('warningMessage');
      warningDiv.textContent = message;
      warningDiv.style.display = 'block';
      setTimeout(() => {
        warningDiv.style.display = 'none';
      }, 3000);
    }

    // Random number animation
    function animateNumber() {
      var numberElement = document.getElementById('number');
      numberElement.classList.add('number-changing');

      var numbers = shuffleArray(Array.from({ length: 15 }, (_, index) => index + 1));
      var currentIndex = 0;
      var duration = 4750;
      var intervalTime = Math.floor(duration / (numbers.length * 2));

      var interval = setInterval(function() {
        if (currentIndex >= numbers.length * 2) {
          clearInterval(interval);
          numberElement.classList.remove('number-changing');
        } else {
          var numberIndex = currentIndex % numbers.length;
          numberElement.textContent = numbers[numberIndex];
          currentIndex++;
        }
      }, intervalTime);

      setTimeout(function() {
        clearInterval(interval);
        if (document.getElementById('comp_round')) {
          numberElement.textContent = document.getElementById('comp_round').textContent;
        }
        numberElement.classList.remove('number-changing');
      }, duration);
    }

    function shuffleArray(array) {
      var currentIndex = array.length,
          temporaryValue,
          randomIndex;

      while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;

        temporaryValue = array[currentIndex];
        array[currentIndex] = array[randomIndex];
        array[randomIndex] = temporaryValue;
      }

      return array;
    }

    $(document).ready(function() {
      // Start number animation
      animateNumber();

      // Format and display compensation amount
      var comp_rgainfinal = {{ comp_rgainfinal }};
      var formattedCompensation = new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        minimumFractionDigits: 0
      }).format(comp_rgainfinal);

      setTimeout(function() {
        var compensationAmtElement = document.getElementById('compensation-amt');
        compensationAmtElement.innerHTML = formattedCompensation;
        compensationAmtElement.style.visibility = 'visible';
      }, 5000);

      // Security measures
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      });

      document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && 
            (e.key === 'c' || e.key === 'v' || e.key === 'u' || 
             e.key === 's' || e.key === 'p' || e.key === 'a')) {
          e.preventDefault();
        }
      });

      // Prevent zoom on mobile
      document.addEventListener('gesturestart', function(e) {
        e.preventDefault();
      });

      document.addEventListener('touchmove', function(e) {
        if (e.scale && e.scale !== 1) {
          e.preventDefault();
        }
      }, { passive: false });
    });
  </script>
</body>
</html>
