<!DOCTYPE html>

<html>
  <head>
    {% include 'bootstrap.html' %}
    <title>TEG</title>
  
    <style>
      p {
        font-family: Arial;
        color: rgb(80,80,80);
        margin-bottom: 20px;
        }
      h1{
        font-size: 40px;
        font-family: Arial;
        color: rgb(80,80,80);
      }
      #container {
        max-width: 70%;
        margin: 10px auto;
        justify-content: center;
        align-items: center;
      }
      .fixed-box-0 {
      height: 700px; 
      overflow: auto; 
      border: 0px solid #ccc; 
      padding: 10px; 
      position: relative;
    }
      .fixed-box-1 {
      font-family: Arial;
      color: rgb(80,80,80);
      height: 550px; 
      overflow: auto; 
      border: 1px solid #ccc; 
      padding: 10px; 
      position: relative;
      margin-left:20px;
      box-shadow: inset 0 0 4px #555;
      border-radius: 10px;
    }
      .fixed-box-2 {
      font-family: Arial;
      color: rgb(80,80,80);
      height: 470px; 
      max-width: 100%;
      overflow: auto; 
      border: 0px solid #ccc; 
      padding: 10px; 
      position: relative;
      margin-left:20px;
      background-color: white;
      }

    </style>

    <script>

      document.addEventListener('DOMContentLoaded', (event) => {
          const video = document.getElementById('tutorialVideo');
          const nextButton = document.getElementById('nextButton'); 

          // Disable the button initially
          nextButton.disabled = true;

          video.addEventListener('ended', () => {
              // Enable the button only after the video has finished playing
              nextButton.disabled = false;
          });
      });

    </script>

  </head>
  
<body>

  <div id="container">
  <div class="fixed-box-0">
    
  <h1></h1>
 
  <p>
    
  </p>
  
  <div class="fixed-box-1">
    Before starting, you have the chance to take part in a single trial round (Round 0). Take a moment to familiarise yourself with the information presented in the screenshots and video below. This will prepare you for the main rounds (Round 1 - Round 15).
    <span id="id" style="color:rgb(256,256,256);font-size:2px;"> 
       {{ id }}</span>
<hr>

  <div class="fixed-box-2">

     <img src="{{ url_for('static', filename='01.jpg') }}"style="max-width:900px;margin-top:0px;margin-left:20px;">

     <img src="{{ url_for('static', filename='02.jpg') }}"style="max-width:900px;margin-top:20px;margin-left:20px;"> 

     <img src="{{ url_for('static', filename='03.jpg') }}"style="max-width:900px;margin-top:20px;margin-left:20px;">

     <img src="{{ url_for('static', filename='04.jpg') }}"style="max-width:900px;margin-top:20px;margin-left:20px;">

    <div style="margin-top: 20px; margin-left: 20px; text-align: center;">  
        <video id="tutorialVideo" width="900" controls style="max-width: 100%; max-height: calc(900px * 9 / 16);">
            <source src="{{ url_for('static', filename='video_explanation.mp4') }}" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>
    
  </div>



  </div>

  <h4 style="margin-left: 20px; 
  margin-bottom: 5px;
  font-family: Arial;
  color: rgb(80,80,80);">
  <b>
  </b>
  </h4>

 
  <br>
  <br>
  <form action="/start" method="POST" >
  <input type="hidden" name="id" value="{{ id }}">
  <input type="hidden" name="lang" value="{{ lang }}">
  <button id="nextButton" style="margin-left: 20px;
  background-color: rgb(10, 103, 173, 0.9); 
  color: white; 
  padding: 10px 30px; 
  border: none; 
  border-radius: 4px; 
  font-size: 16px; 
  font-weight: bold;"
  type="submit"
  onmouseover="this.style.backgroundColor = 'rgb(10, 103, 173, 0.7)'"
  onmouseout="this.style.backgroundColor = 'rgb(10, 103, 173, 0.9)'"
  
  >
  Next
  </button>

  </form>

  </div>


  </div>

</body>
  
</html>
