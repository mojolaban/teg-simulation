<!DOCTYPE html>
<html>
<head>
    <title>Language Selection</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial;
            color: rgb(80,80,80);
        }
        h1, form {
            text-align: center;
        }
        form {
            margin-top: 10px;
        }
        #nextButton {
            margin-left: 20px;
            background-color: rgba(10, 103, 173, 0.9);
            color: white;
            padding: 10px 30px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
        }
        #nextButton:hover {
            background-color: rgba(10, 103, 173, 0.7);
        }
        select {
          height: 40px;
          width: 120px;
          border: none;
          border-radius: 10px;
          background-color: #f0f0f0;
          padding: 5px;
          font-weight: bold;
          font-size: 16px;
        }
    </style>
  
</head>
<body>
    <h1>Select Language:</h1>
    <form action="/select_language" method="POST">
        <select name="language" required>
            <option value="English">English</option>
            <option value="Indonesian">Indonesian</option>
        </select>
        <button id="nextButton" type="submit">Submit</button>
    </form>
  <p style="margin-top:35px;">Best viewed on desktop/laptop.</p>
</body>
</html>
