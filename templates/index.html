<!DOCTYPE html>
<html>
<head>
    <title>Passcode Validation</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial;
            color: rgb(80,80,80);
        }
  
        h1, form {
            text-align: center;
        }
  
        form {
            margin-top: 10px;
        }
  
        #warning {
            color: red;
            display: none;
        }

        #nextButton {
            margin-left: 20px;
            background-color: rgba(10, 103, 173, 0.9); /* Use rgba to set opacity */
            color: white;
            padding: 10px 30px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
        }
  

        #nextButton:hover {
            background-color: rgba(10, 103, 173, 0.7); 
        }
        input[type="text"] {
          height: 33px;
          border: none; /* Remove border */
          border-radius: 10px;
          background-color:  #f0f0f0; /* Set background color to light gray */
          padding: 5px; /* Add some padding for better appearance */

        }

    </style>
</head>
<body>
    <h1>Enter Passcode:</h1>
    <form id="passcodeForm" action="/validate_passcode" method="POST">
        <input type="text" name="passcode" maxlength="20" required>
        <button id="nextButton" value="Submit" type="submit">Submit</button>

    </form>
    <div id="warning" style="color: red; display: none;">Invalid Passcode! Please try again.</div>
</body>
</html>
